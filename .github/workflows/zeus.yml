name: Zeus TV Link Scanner

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (cron ifadesini ihtiyacınıza göre düzenleyebilirsiniz)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel olarak "Run workflow" butonuna basarak tetiklemeyi sağlar

jobs:
  scan-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyayı repoya geri commit edebilmek için yazma izni
    
    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Tarama Scriptini Calistir
        run: |
          python zeus.py

      - name: zeus.txt Dosyasini Repoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zeus.txt
          # Eğer zeus.txt içeriğinde bir değişiklik olduysa commit yap ve gönder
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik guncelleme: Yeni zeus.txt linkleri eklendi [skip ci]" && git push)
