name: Zeus TV Link Scanner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Tarama Scriptini Calistir
        run: |
          python bulucu.py

      - name: zeus.txt Dosyasini Repoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dosya gerçekten oluştuysa işlem yap, oluşmadıysa hata verme
          if [ -f zeus.txt ]; then
            git add zeus.txt
            git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik guncelleme: Yeni zeus.txt linkleri eklendi [skip ci]" && git push)
          else
            echo "Calisan link bulunamadigi icin zeus.txt olusturulamadi."
          fi
