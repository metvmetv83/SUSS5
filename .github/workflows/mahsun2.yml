name: Update Mahsun2 M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir çalışır
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Repository'yi Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri ve Playwright Kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Scripti Çalıştır
        run: python mahsun2.py

      - name: Değişiklikleri Commit Et ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mahsun2.m3u
          git diff --staged --quiet || (git commit -m "Auto-update mahsun2.m3u playlist" && git push)
